version: '3.8'

services:
  crmai:
    image: wagnerbao/crm-ai:latest
    networks:
      - network_public
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8093
      - ConnectionStrings__CrmDatabase=Host=postgres;Port=5432;Database=crmdb;Username=crm_user;Password=crmPostgresPasS
      - RabbitMQ__Uri=amqp://admin:rabbitBrokerPasS@5.161.71.93:5672/
      - RabbitMQ__OpportunityAnalysisQueue=crm.projections.opportunity-analysis
      - RabbitMQ__ActivityAnalysisQueue=crm.projections.activity-analysis
      - RabbitMQ__DailyCheckinQueue=crm.projections.daily-checkin
      - RabbitMQ__DailyCheckoutQueue=crm.projections.daily-checkout
      - RabbitMQ__GamificationQueue=crm.projections.gamification
      - RabbitMQ__PrefetchCount=8
      - RabbitMQ__RequeueOnFailure=false
      - RabbitMQ__DeadLetterExchange=crm.projections.dlx
      - RabbitMQ__DeadLetterQueueSuffix=.dlq
      - RabbitMQ__DailyCheckinSnapshotIntervalMinutes=15
      - RabbitMQ__DailyCheckoutSnapshotIntervalMinutes=15
      - OpenAI__Model=gpt-4.1-mini
      - OpenAI__ResponsesEndpoint=https://api.openai.com/v1/responses
      - OPENAI_TRANSCRIPTION_MODEL=gpt-4o-transcribe
      - OPENAI_TRANSCRIPTION_FALLBACK_MODEL=whisper-1
      - OPENAI_TRANSCRIPTION_SEGMENT_SECONDS=600
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.crmai.rule=Host(`crmai.skoposws.com.br`)"
        - "traefik.http.routers.crmai.entrypoints=websecure"
        - "traefik.http.routers.crmai.priority=1"
        - "traefik.http.routers.crmai.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.crmai.service=crmai"
        - "traefik.http.services.crmai.loadbalancer.server.port=8093"

networks:
  network_public:
    name: network_public
    external: true
